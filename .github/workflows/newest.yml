name: newest-check

# 15分おきに3グループの公式ブログ新着を確認し、新着があれば取り込んで自動デプロイする
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: sakamichia-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch newest blog posts
        env:
          SAKAMICHIA_NO_ZIP: '1'
        run: python3 tools/newest_check.py

      - name: Fetch official news
        run: python3 tools/fetch_news.py

      - name: Pack blog bodies into shards
        run: python3 tools/pack_bodies.py

      - name: Sync body flags with packed bodies
        run: python3 tools/sync_body_flags.py

      - name: Commit data updates
        id: commit
        run: |
          git config user.name 'sakamichia-bot'
          git config user.email 'actions@github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'blog: newest check'
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude tools --exclude .git --exclude .github ./ /tmp/site/
          npx --yes wrangler@3 pages deploy /tmp/site --project-name=sakamichia --branch=main
