name: deploy-img

# AI画像クイズの画像（assets/ai-quiz）を画像専用プロジェクト sakamichia-img へデプロイする。
# 本体サイト（sakamichia）の Pages 20,000ファイル上限対策として、画像だけ別プロジェクトに分離した（2026-11-13）。
# 本体側のデプロイ（deploy.yml 等）では assets/ai-quiz を除外している。
on:
  push:
    branches: [main]
    paths:
      - 'assets/ai-quiz/**'
      - '.github/workflows/deploy-img.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy AI quiz images to Cloudflare Pages (sakamichia-img)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/img/assets
          rsync -a assets/ai-quiz /tmp/img/assets/
          set +e
          # プロジェクトが無い環境では deploy が対話プロンプトで失敗するため、先に作成しておく（既存なら失敗するので無視）
          npx --yes wrangler@3 pages project create sakamichia-img --production-branch=main > /tmp/create.log 2>&1
          echo "create exit: $?"
          npx --yes wrangler@3 pages deploy /tmp/img --project-name=sakamichia-img --branch=main > /tmp/deploy.log 2>&1
          code=$?
          echo "deploy exit: $code"
          if [ $code -ne 0 ]; then
            # 失敗時は wrangler の出力を Issue に残す（Actions ログを外部から読めないため）
            { echo 'deploy-img failed.'; echo; echo '== create.log (tail) =='; tail -c 3000 /tmp/create.log; echo; echo '== deploy.log (tail) =='; tail -c 6000 /tmp/deploy.log; } > /tmp/issue.md
            gh issue create --title "deploy-img failure log" --body-file /tmp/issue.md || true
            exit $code
          fi
