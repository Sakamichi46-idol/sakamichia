name: deploy-img

# AI画像クイズの画像（assets/ai-quiz）を画像専用プロジェクト sakamichia-img へデプロイする。
# 本体サイト（sakamichia）の Pages 20,000ファイル上限対策として、画像だけ別プロジェクトに分離した（2026-11-13）。
# 本体側のデプロイ（deploy.yml 等）では assets/ai-quiz を除外している。
on:
  push:
    branches: [main]
    paths:
      - 'assets/ai-quiz/**'
      - '.github/workflows/deploy-img.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Deploy AI quiz images to Cloudflare Pages (sakamichia-img)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/img/assets
          rsync -a assets/ai-quiz /tmp/img/assets/
          npx --yes wrangler@3 pages deploy /tmp/img --project-name=sakamichia-img --branch=main
