name: body-backfill

# 6時間おきに、本文がまだ無い既存記事を公式ページから少しずつ（300件ずつ）
# 取り込み、自動デプロイする。本文が揃うまで自動で進み、揃った後は
# 対象0件ですぐ終わる。取り込み状況は tools/body-backfill-state.json に残る。
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sakamichia-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backfill blog bodies (300 per run)
        env:
          SAKAMICHIA_NO_ZIP: '1'
        run: python3 tools/backfill_bodies.py --limit 300

      - name: Pack blog bodies into shards
        run: python3 tools/pack_bodies.py

      - name: Sync body flags with packed bodies
        run: python3 tools/sync_body_flags.py

      - name: Commit data updates
        id: commit
        run: |
          git config user.name 'sakamichia-bot'
          git config user.email 'actions@github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'blog: body backfill'
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude tools --exclude .git --exclude .github ./ /tmp/site/
          npx --yes wrangler@3 pages deploy /tmp/site --project-name=sakamichia --branch=main
