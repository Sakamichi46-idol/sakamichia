.mm-card.done{cursor:default}

.mm-front.noimg{background:var(--bg)}
.mm-front.noimg img{display:none}
.mm-front.noimg .mm-name{position:static;background:none;color:var(--ink);font-size:14px;font-weight:700;white-space:normal}
.mm-msg{max-width:430px;margin:8px auto;color:var(--muted);font-size:13px;text-align:center;min-height:1.4em}
