<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ブログアーカイブ | サカミチア</title><meta name="description" content="坂道グループのブログ記事情報を、グループ・メンバー・期間から検索できるブログアーカイブ。非公式ファンサイトです。"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../apple-touch-icon.png"><meta name="theme-color" content="#faf9fb"><meta property="og:type" content="website"><meta property="og:site_name" content="サカミチア"><meta property="og:title" content="ブログアーカイブ | サカミチア"><meta property="og:description" content="坂道グループのブログ記事情報を、グループ・メンバー・期間から検索できるブログアーカイブ。非公式ファンサイトです。"><meta property="og:url" content="https://sakamichia.pages.dev/blog/"><meta property="og:image" content="https://sakamichia.pages.dev/og.png"><meta name="twitter:card" content="summary_large_image"><link rel="stylesheet" href="../assets/css/style.css?v=41"></head>
<body data-base="../">
<header class="site"><div class="wrap nav"><a class="logo" href="../">サカミチ<span class="grad">ア</span><span class="dots"><i></i><i></i><i></i></span></a><nav><a href="../">ホーム</a><a href="./" class="on">ブログ</a><a href="../songs/">楽曲図鑑</a><a href="../live/">歴代ライブ</a><a href="../members/">メンバー</a><a href="../games/">ミニゲーム</a><a href="../formation/">マイフォーメーション</a><a href="../setlist/">マイセットリスト</a></nav></div></header>
<main class="wrap"><section class="page"><h2 class="title">ブログアーカイブ</h2><p class="lead">グループ・メンバー・期間から、公開済みの過去記事情報を検索します。カードの「記事を見る」を押すと、本文がそのまま読めます。</p>
<div class="filters"><input id="q" type="search" placeholder="キーワード（タイトル・メンバー）" size="26">
<span class="gchips" id="groupChips"><button type="button" class="ychip gchip on" data-g="">すべてのグループ</button><button type="button" class="ychip gchip" data-g="乃木坂46">乃木坂46</button><button type="button" class="ychip gchip" data-g="櫻坂46">櫻坂46</button><button type="button" class="ychip gchip" data-g="日向坂46">日向坂46</button><button type="button" class="ychip gchip" data-g="欅坂46">欅坂46</button><button type="button" class="ychip gchip" data-g="けやき坂46">けやき坂46</button></span>
<select id="member"><option value="">すべてのメンバー</option></select>
<button type="button" id="advToggle" aria-expanded="false">詳細検索 ▼</button><button type="button" id="resetAll">条件をリセット</button></div>
<div class="advanced" id="advanced" hidden>
<p class="adv-label">年（押すとその年だけ／もう一度押すと全期間）</p>
<div class="years" id="years"></div><p class="year-hint" id="yearHint"></p>
<p class="adv-label">期間指定</p>
<div class="filters period"><label class="datefld"><span>開始日</span><input id="from" type="text" inputmode="numeric" autocomplete="off" placeholder="年/月/日"></label><span>〜</span><label class="datefld"><span>終了日</span><input id="to" type="text" inputmode="numeric" autocomplete="off" placeholder="年/月/日"></label></div>
<div class="presets"><button type="button" class="ychip" data-preset="clear">期間クリア</button></div>
<p class="adv-label">写真・本文</p>
<div class="presets"><button type="button" class="ychip mchip" data-media="">すべて</button><button type="button" class="ychip mchip" data-media="photo">写真あり</button><button type="button" class="ychip mchip" data-media="body">本文あり</button></div>
<p class="adv-label">本文キーワード</p>
<div class="filters advrow"><input id="bq" type="search" placeholder="本文に含まれる言葉" size="26"></div>
<p class="year-hint" id="bqNote">本文のある記事のみ対象です。タイトル検索とは別に、本文の中身で絞り込めます（2文字以上）。</p>
<p class="adv-label">並び替え・期生</p>
<div class="filters advrow"><select id="sort"><option value="new">新しい順</option><option value="old">古い順</option><option value="photos">写真が多い順</option></select><select id="gen"><option value="">すべての期生</option></select></div>
</div>
<div class="count-row"><p class="count" id="count"></p><div class="vtoggle"><button type="button" id="viewArticles" class="on">記事一覧</button><button type="button" id="viewPhotos">写真一覧</button></div></div>
<p class="legend">バッジの見方：「写真N枚」はその記事の写真の枚数、「本文あり」はサイト内で本文が読める記事です。</p>
<div id="list"></div></section></main>
<dialog id="dlg"><div class="dlg-head"><button type="button" id="dlgClose" class="dlg-close" aria-label="閉じる">×</button></div><div id="dlgBody"></div></dialog>
<script src="../assets/js/common.js"></script><script src="../assets/js/blog.js"></script>
</body></html>
